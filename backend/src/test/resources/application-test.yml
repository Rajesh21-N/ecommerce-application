spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: none
  data:
    redis:
      host: localhost
      port: 6399

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LWZvci1wcm9k
    expiration-ms: 3600000
  mail:
    enabled: false
    from: test@example.com
  razorpay:
    enabled: false
    key-id: test
    key-secret: test
